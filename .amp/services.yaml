services:
  web:
    command: >-
      php artisan config:clear &&
      APP_URL="$PUBLIC_URL" ASSET_URL="$PUBLIC_URL"
      php artisan serve --host=0.0.0.0 --port="$PORT"
    health: /up
    portal:
      title: /dev/null
      description: Uses built assets. Run bun run build after frontend changes.
